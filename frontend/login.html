<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoAi - Login</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script>
        if (localStorage.getItem('odontoai_dark_mode') === '1') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>

<body>
    <div class="login-page">
        <form class="card login-card" id="login-form">
            <div class="logo" style="justify-content: center; margin-bottom: 1.4rem;">
                <img src="assets/images/OdontoAi_Logo.png" style="width: 3.5rem; height: 3.5rem;">
                <h2>Odonto<span class="ColorAi">AI</span></h2>
            </div>

            <div class="campo-form">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email" value="carlos@odontoai.com" required>
            </div>

            <div class="campo-form">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" name="senha" value="123456" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.6rem;">
                Entrar
            </button>

            <p class="text-muted" style="text-align: center; margin-top: 1rem; font-size: 0.75rem;">
                Lembre-se de sair da sua conta ao usar um computador público ou compartilhado.
            </p>
        </form>
    </div>

    <script>
document.getElementById('login-form').addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const email = document.getElementById('login-email').value;
    const senha = document.getElementById('login-senha').value;

    try {
        const resposta = await fetch('/api/login', {    
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include', // manda/recebe o cookie de sessão entre frontend e backend
            body: JSON.stringify({ email, password: senha }),
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            alert(dados.error || 'Não foi possível entrar.');
            return;
        }

        window.location.href = 'index.html';
    } catch (erro) {
        console.error('Erro ao conectar no servidor:', erro);
        alert('Não foi possível conectar ao servidor. Confirma que o backend está rodando (node server.js).');
    }
});
    </script>
</body>

</html>
